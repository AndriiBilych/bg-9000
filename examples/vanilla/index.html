<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bg-9000 playground</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body>
    <canvas id="bg"></canvas>

    <aside class="panel">
      <h1>bg-9000 <span class="ver">v0.1</span></h1>

      <div class="row">
        <label for="preset">Preset</label>
        <select id="preset"></select>
      </div>

      <div class="row">
        <label for="amount">Amount</label>
        <select id="amount">
          <option value="low">low</option>
          <option value="moderate" selected>moderate</option>
          <option value="alot">a lot</option>
        </select>
      </div>

      <div class="row">
        <label for="size">Size</label>
        <select id="size">
          <option value="small">small</option>
          <option value="medium" selected>medium</option>
          <option value="large">large</option>
        </select>
      </div>

      <div class="row">
        <label for="style">Style</label>
        <select id="style"></select>
      </div>

      <div class="row">
        <label for="palette">Palette</label>
        <select id="palette"></select>
      </div>

      <div class="swatches" id="swatches"></div>

      <div class="row">
        <label for="speed">Speed <output id="speedOut">1.0</output></label>
        <input id="speed" type="range" min="0" max="4" step="0.1" value="1" />
      </div>

      <div class="row">
        <label for="drag">Drag <output id="dragOut">0.00</output></label>
        <input id="drag" type="range" min="0" max="2" step="0.05" value="0" />
      </div>

      <div class="row">
        <label for="restitution">Bounce <output id="restOut">1.00</output></label>
        <input id="restitution" type="range" min="0" max="1" step="0.05" value="1" />
      </div>

      <div class="row check">
        <input id="collisions" type="checkbox" checked />
        <label for="collisions">Collisions</label>
      </div>

      <div class="row buttons">
        <button id="reseed" type="button">Reseed</button>
        <button id="toggle" type="button">Pause</button>
      </div>

      <dl class="stats">
        <div><dt>fps</dt><dd id="fps">–</dd></div>
        <div><dt>circles</dt><dd id="count">–</dd></div>
        <div><dt>contacts</dt><dd id="contacts">–</dd></div>
        <div><dt>dpr</dt><dd id="dpr">–</dd></div>
      </dl>

      <p class="note">
        Contacts is overlapping pairs resolved on the last step.
        <a href="./gallery.html">All 15 combinations →</a>
      </p>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
